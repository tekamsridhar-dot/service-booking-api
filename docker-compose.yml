version: "3.9"

services:
  api:
    build: .
    container_name: service-booking-api

    ports:
      - "8001:8000"

    env_file:
      - .env

    depends_on:
      - db

    volumes:
      - .:/app

  db:
    image: postgres:16

    container_name: postgres-db

    restart: always

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: service_booking_db

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: